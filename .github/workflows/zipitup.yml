# Build the installable plugin zip and attach it when a release is published or on demand.
# workflow_dispatch can re-upload the zip for an existing tag (e.g. after a failed Action).
name: Generate Installable Plugin, and Upload as Release Asset
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the installable zip to (e.g. v1.0.3)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          coverage: none

      - name: Create artifact
        run: composer zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${RELEASE_TAG:-}}"
          ZIP="build/webberzone-acf-country.zip"
          ASSET="webberzone-acf-country.zip"

          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          if [ ! -f "$ZIP" ]; then
            echo "Missing $ZIP" >&2
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist on GitHub." >&2
            exit 1
          fi

          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "$TAG already has $ASSET; uploading with --clobber to refresh."
          fi

          gh release upload "$TAG" "$ZIP" --clobber
          echo "Uploaded $ASSET to $TAG."