title: WebberZone ACF Country
description: Documentation for WebberZone ACF Country — a Country field type for Advanced Custom Fields.
url: https://webberzone.github.io
baseurl: /webberzone-acf-country

plugin_name: WebberZone ACF Country
plugin_slug: webberzone-acf-country

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - build
  - phpunit
  - phpcompat-tools
  - includes
  - languages
  - assets
  - build-zip.sh
  - composer.json
  - composer.lock
  - readme.txt
  - changelog.txt
  - phpstan-bootstrap.php
  - "*.php"
  - "*.dist"
  - "*.neon"
  - README.md
  - AGENTS.md
  - CLAUDE.md
